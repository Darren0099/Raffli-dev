name: Import authentic About Me documentation
on:
  push:
    paths:
      - .github/workflows/import-aboutme-photos.yml
permissions:
  contents: write
jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download uploaded source photos
        env:
          URL_POL: "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fbe573e99-a099-4f9e-82c2-505e59a45b0c/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAIvBPcTLecwkQraH4YVX9Srv5qhFc7pHM3Az_2t2lzwT&exp=1794143449&osig=AAAAAAAAAAAAAAAAAAAAAInLDxgEpnhoQuozvE-I1lxjNP6qO8iyvq1KzFxJPxT0&signer=media-rpc&token=AAIAAU0AJGJlNTczZTk5LWEwOTktNGY5ZS04MmMyLTUwNWU1OWE0NWIwYwAAAAABobtIb6g9LkOMBm5SZj0h8Yl9u2BF88azTrRpms5MCK8a4ziRkg&x-canva-quality=thumbnail"
          URL_YRI: "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fccd6f3d5-c4e3-4a77-a0b7-27711926b12d/watermark:F/width:185?csig=AAAAAAAAAAAAAAAAAAAAAMlVjbN8tKDXmZ2UzHCr8KK_iPwQR33Uw90Brcq7T6Du&exp=1794142588&osig=AAAAAAAAAAAAAAAAAAAAAOy4OgslwwKozTDStBIYKWgPmJmASkm_ZGPgRAbaNOt6&signer=media-rpc&token=AAIAAU0AJGNjZDZmM2Q1LWM0ZTMtNGE3Ny1hMGI3LTI3NzExOTI2YjEyZAAAAAABobs7TGB2KNllbJkxCmeKipTZTn7BAu4YHx_-ZNYCb9rwMUzV-A&x-canva-quality=thumbnail"
          URL_KMIPN: "https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F7b20b603-104b-411d-bc0b-f621248b671a/watermark:F/width:150?csig=AAAAAAAAAAAAAAAAAAAAAGY_FEnfUBuk7QBNK59ZMWcdjnEuG8Bclsvcru64WJY9&exp=1794145211&osig=AAAAAAAAAAAAAAAAAAAAABJsZDsAdcxqnwe5-Q1GGoFj5iv49kptCpNlJx-eFWdA&signer=media-rpc&token=AAIAAU0AJDdiMjBiNjAzLTEwNGItNDExZC1iYzBiLWY2MjEyNDhiNjcxYQAAAAABobtjUnhsoo7uzv8VKngK9w3mLFhn8GjvCRE3F73Yc7eEQPXkFg&x-canva-quality=thumbnail"
          URL_PLN: "https://media.canva.com/v2/image-resize/format:JPG/height:112/quality:75/uri:ifs%3A%2F%2FM%2F1ada7a19-2574-47b8-81af-1714afe68bd7/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAACCCmaOkKoKRB7qe0-MClMyGjmCh4AfJ5SYfWPLJWssW&exp=1794144951&osig=AAAAAAAAAAAAAAAAAAAAALboFrLtqpb1LAPIRU34uvQNP-SVidScne-sX4O_7GiP&signer=media-rpc&token=AAIAAU0AJDFhZGE3YTE5LTI1NzQtNDdiOC04MWFmLTE3MTRhZmU2OGJkNwAAAAABobtfWtgY7Ye0j34z3B7UIS_8HW8s9FuEnJdwn5ONoD5mWxD-TQ&x-canva-quality=thumbnail"
          URL_DPPI: "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F39e0939d-a950-4508-8764-8bc57ad60b0a/watermark:F/width:150?csig=AAAAAAAAAAAAAAAAAAAAAOeujMnEQnzX7klEw4-TpbZELpxOzItb9l3D08RmFft0&exp=1794144436&osig=AAAAAAAAAAAAAAAAAAAAAKd7c-WAdRsbB0s70wPaI6mCM4n8nECujydr7NyKKQCm&signer=media-rpc&token=AAIAAU0AJDM5ZTA5MzlkLWE5NTAtNDUwOC04NzY0LThiYzU3YWQ2MGIwYQAAAAABobtXfyCl_D-xIucWhdAJBsj370wnvQH9em9E-oSSBObYbLbAkQ&x-canva-quality=thumbnail"
        run: |
          set -euo pipefail
          mkdir -p public/aboutme
          curl --retry 3 --fail --location --silent --show-error "$URL_POL" --output public/aboutme/polsri-logo.png
          curl --retry 3 --fail --location --silent --show-error "$URL_YRI" --output public/aboutme/yri-festival.png
          curl --retry 3 --fail --location --silent --show-error "$URL_KMIPN" --output public/aboutme/kmipn-vi.jpg
          curl --retry 3 --fail --location --silent --show-error "$URL_PLN" --output public/aboutme/pln-iconplus.jpg
          curl --retry 3 --fail --location --silent --show-error "$URL_DPPI" --output public/aboutme/dppi-youthopia.png
          # Test whether signed source URLs permit a higher-resolution resize.
          TRY_BIG_YRI="${URL_YRI/height:200/height:900}"
          TRY_BIG_YRI="${TRY_BIG_YRI/width:185/width:833}"
          if curl --max-time 20 --fail --location --silent --show-error "$TRY_BIG_YRI" -o /tmp/yri-big.png; then
            if [[ $(file --mime-type -b /tmp/yri-big.png) == image/* ]]; then
              cp /tmp/yri-big.png public/aboutme/yri-festival.png
              echo "YRI expanded to $(wc -c < public/aboutme/yri-festival.png) bytes"
            fi
          else
            echo "Signed URL did not allow higher resolution; retaining available original import."
          fi
          file public/aboutme/*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/aboutme
          git commit -m "assets: add original user-provided About Me event images" || exit 0
          git push origin HEAD:main
