name: KleinData portfolio mockups

on:
  push:
    branches: [main]
    paths:
      - 'scripts/kleindata_mockups.py'
      - '.github/workflows/kleindata-mockups.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install imaging and browser tools
        run: |
          python -m pip install --disable-pip-version-check Pillow playwright
          python -m playwright install --with-deps chromium
      - name: Capture the real KleinData application and create four device mockups
        run: python scripts/kleindata_mockups.py
      - name: Publish generated images to public/img
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img/kleindata-landscape-desk.jpg public/img/kleindata-landscape-studio.jpg public/img/kleindata-portrait-phone.jpg public/img/kleindata-portrait-tablet.jpg
          if ! git diff --cached --quiet; then
            git commit -m "assets: publish four KleinData laptop, phone and tablet mockups"
            git push origin HEAD:main
          fi
